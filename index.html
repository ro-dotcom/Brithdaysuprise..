<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Someone Has a Surprise for You! 🎂</title>

    <meta name="description"
          content="Someone has prepared a special birthday surprise just for you! 🎁">

    <!-- WhatsApp Link Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title"
          content="Someone Has a Special Surprise for You! 🎂">
    <meta property="og:description"
          content="A little birthday magic is waiting for you. Open to discover! 🎁">

    <!-- Replace this with your deployed landing-page image URL -->
    <meta property="og:image"
          content="https://YOUR-LANDING-PAGE.vercel.app/birthday-preview.jpg">

    <meta property="og:url"
          content="https://YOUR-LANDING-PAGE.vercel.app/">

    <meta name="theme-color" content="#ff5c8a">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-family: Arial, sans-serif;
            color: #ffffff;
            background: linear-gradient(135deg, #ff5c8a, #ffb347);
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px 24px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(100, 20, 50, 0.2);
        }

        .cake {
            font-size: 76px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.2;
            margin: 0 0 16px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        a {
            display: inline-block;
            padding: 15px 28px;
            border-radius: 50px;
            background: #ffffff;
            color: #e83e70;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .note {
            margin-top: 24px;
            font-size: 13px;
        }
    </style>

    <!-- Redirect after the page loads -->
    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                window.location.replace(
                    "https://happy-birthdaysuar.vercel.app/"
                );
            }, 2500);
        });
    </script>
</head>

<body>
    <main class="card">
        <div class="cake">🎂</div>

        <h1>Someone Has a Special Surprise for You!</h1>

        <p>
            A little birthday magic is waiting for you.
            Get ready to discover something special! 🎁✨
        </p>

        <a href="https://happy-birthdaysuar.vercel.app/">
            Open Your Surprise 🎉
        </a>

        <div class="note">
            Your surprise is just a moment away! ❤️
        </div>
    </main>
</body>
</html>
