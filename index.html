
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Special Surprise for You! 🎂</title>

  <meta
    name="description"
    content="A special birthday surprise just for you. Tap to discover it!"
  >

  <meta name="theme-color" content="#fff0f5">
  <meta name="robots" content="index, follow">

  <!-- Open Graph metadata for WhatsApp and social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Birthday Surprise">

  <meta
    property="og:title"
    content="A Special Surprise for the birthday girl! 🎂"
  >

  <meta
    property="og:description"
    content="A little birthday magic is waiting for you. Tap to discover your surprise!"
  >

  <meta
    property="og:url"
    content="https://brithdaysuprise.vercel.app/"
  >

  <meta
    property="og:image"
    content="https://brithdaysuprise.vercel.app/preview-share.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://brithdaysuprise.vercel.app/preview-share.png"
  >

  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1734">
  <meta property="og:image:height" content="907">

  <meta
    property="og:image:alt"
    content="A Special Surprise for You!"
  >

  <!-- Twitter / X preview metadata -->
  <meta name="twitter:card" content="summary_large_image">

  <meta
    name="twitter:title"
    content="A Special Surprise for You!"
  >

  <meta
    name="twitter:description"
    content="A little birthday magic is waiting for you."
  >

  <meta
    name="twitter:image"
    content="https://brithdaysuprise.vercel.app/preview-share.png"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #fff5df,
        #ffe0e8
      );
      color: #57243d;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 38px 26px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 15px 45px rgba(133, 51, 83, 0.15);
      border: 1px solid #ffffff;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(30px, 7vw, 43px);
      line-height: 1.15;
      margin-bottom: 16px;
      color: #b83268;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 26px;
      color: #70465a;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 50px;
      background: linear-gradient(135deg, #e94e89, #bd3470);
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(189, 52, 112, 0.25);
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .button:focus-visible {
      outline: 3px solid #57243d;
      outline-offset: 4px;
    }

    .footer {
      margin-top: 26px;
      margin-bottom: 0;
      font-size: 13px;
      color: #987487;
    }

    @media (max-width: 400px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 30px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }

      .button:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🎂🎁</div>

    <h1>A Special Surprise for You!</h1>

    <p>
      A little birthday magic just for you.
      Are you ready to discover something special?
    </p>

    <a
      class="button"
      href="https://happy-birthdaysuar.vercel.app/"
    >
      Open Your Surprise ✨
    </a>

    <p class="footer">
      Made with Gobar, just for you(Suar)
    </p>
  </main>
</body>
</html>
